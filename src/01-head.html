[lang="ar"]{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:1.12em}
.tkt[lang="ar"],.tkt [lang="ar"]{direction:rtl}.tkt .arf{display:block;font-family:"Amiri","Noto Naskh Arabic",serif;font-size:15px;color:var(--ink-soft);margin-top:2px;letter-spacing:2px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.45;min-height:100%;background-color:var(--bg);background-image:var(--bgimg);background-size:var(--bgsize)}
.page{max-width:1560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* cabeçalho */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px}
.title{display:flex;align-items:center;gap:16px;min-width:0}
.flagbox{flex:0 0 auto;border:3px solid var(--p1);box-shadow:0 0 0 2px var(--ink),0 6px 18px rgba(0,0,0,.45);border-radius:4px;background:#fff;line-height:0}
.flagbox svg{width:84px;height:56px;display:block}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.6vw,56px);line-height:.98;margin:0;color:var(--ontop);text-shadow:0 3px 0 rgba(0,0,0,.55)}
.head h1 span{color:var(--p1l)}
.sub{color:var(--ontop-soft);font-style:italic;font-size:16px;margin-top:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--paper);border:2px solid var(--p1);box-shadow:inset 0 0 0 1px var(--p2),0 6px 14px rgba(0,0,0,.35);border-radius:3px;padding:7px 14px;min-width:112px}
.stat small{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--p2);font-weight:700}
.stat b{font-family:var(--display);font-weight:600;font-size:22px;color:var(--p3);font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;font-style:italic;color:var(--ink-soft)}

.gearbtn{display:flex;align-items:center;gap:8px;border:2px solid var(--p1);background:rgba(0,0,0,.35);color:var(--ontop);border-radius:999px;padding:9px 16px 9px 10px;font:700 14px var(--serif);cursor:pointer;align-self:center}
.gearbtn svg{width:22px;height:22px;flex:0 0 auto}
.gearbtn:hover{background:rgba(0,0,0,.5)}
.gearbtn:focus-visible{outline:3px solid var(--p1l);outline-offset:2px}
@media (max-width:560px){.gearbtn span{display:none}.gearbtn{padding:9px}}

/* modal de configurações */
.modalcard{position:relative;width:min(520px,100%);max-height:86vh;overflow:auto;background:var(--paper);border:3px solid var(--p1);outline:1.5px solid var(--p2);outline-offset:-8px;border-radius:4px;box-shadow:0 0 0 2px var(--ink),0 30px 60px rgba(0,0,0,.6);padding:30px 26px 26px;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.lvask p{margin:10px 0 0;font-size:17px;line-height:1.45}
.lvaskbtns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.lvaskbtns a{text-align:center;text-decoration:none;display:block}
.modalx{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:999px;border:2px solid var(--p1);background:var(--paper);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.modalx:hover{background:var(--paper-dk)}
.modalx:focus-visible{outline:3px solid var(--p3);outline-offset:2px}
.setsec{margin-top:18px}
.setdiv{border-top:2px dashed var(--p1d);opacity:.5;margin:20px 0 16px}
.modalcard .langs{margin-top:2px}
.exbtn{margin-right:8px}
.exintro .intro,.wrintro .intro,.tdintro .intro{margin:4px 0 12px}
.wrsteps{margin:10px 0 14px;padding-left:22px;font-size:16.5px;line-height:1.45}
.wrpage{margin:6px 0 14px;padding:18px 18px 8px;background:linear-gradient(#FFFDF6,#F6EBCF);border:1.5px solid rgba(42,30,20,.35);border-left:6px solid var(--p2);border-radius:3px;box-shadow:inset 0 0 22px rgba(120,90,40,.12)}
.wrline{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;margin-bottom:16px}
.wrnum{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--p2);color:#FFF8E6;font:700 13px var(--serif);margin-top:3px}
.wren{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.55;color:var(--ink)}
.wrpart{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-soft);font-style:italic}
.wrpt{margin:6px 0 0;font-size:16px;line-height:1.4;color:var(--ink-soft);font-style:italic}
.wrtools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.wrgloss{margin:0 0 14px;padding:10px 14px;border:1.5px dashed var(--p1);border-radius:3px;background:rgba(201,161,59,.12);font-size:15.5px}
.wrgloss ul{margin:6px 0 0;padding-left:18px;columns:2;column-gap:22px}
.wrfinish{display:block;width:100%;margin-top:4px}
.wrsrc{margin-top:12px;font-size:13px}
.wrtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.wrtabs button[aria-pressed="true"]{background:var(--p1);border-color:var(--ink)}
.bknav{flex-wrap:wrap;align-items:center;gap:8px}.bkgo{font-size:13px;display:inline-flex;align-items:center;gap:6px}.bkgo input{width:70px;padding:6px 8px;border:1px solid var(--line,#b9a77d);border-radius:8px;font:inherit}
.bkfull{position:fixed;inset:0;z-index:2000;background:#1b1a22;display:flex;flex-direction:column}
.bkfbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#2a2430;flex-wrap:wrap}
.bkfgo{color:#f3e6c4;font-size:13px;display:inline-flex;align-items:center;gap:6px}.bkfgo input{width:64px;padding:6px 8px;border:1px solid #b9a77d;border-radius:8px;font:inherit}
.bkft{flex:1;color:#f3e6c4;font-size:14px;min-width:120px}
.bkfscroll{flex:1;overflow:auto;text-align:center;padding:12px}
.bkfscroll .wrcanvas{max-width:none;height:auto}
body.bkfullon{overflow:hidden}

.timer .tb:hover{background:rgba(0,0,0,.45)}
.timer.over{background:var(--p2);border-color:var(--p2)}

.blocks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.blk{display:grid;grid-template-columns:28px 54px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1.5px solid rgba(42,30,20,.3);border-radius:3px;background:rgba(255,255,255,.35);transition:background .2s}
.blk:hover{background:rgba(255,255,255,.65)}
.coin{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),transparent 60%),var(--tc);color:#FFF8E6;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2.5px solid var(--p1);box-shadow:0 0 0 1.5px var(--ink),0 3px 0 var(--ink);line-height:1}
.coin b{font-size:20px;font-variant-numeric:tabular-nums}
.coin small{font-size:10.5px;letter-spacing:.06em}
.blk .bt{cursor:pointer;min-width:0}
.blk .bt small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tc);font-weight:700}
.blk .bt b{display:block;font-size:17.5px;line-height:1.25;color:var(--ink)}
.blk .bt span{display:block;font-size:15px;line-height:1.35;color:var(--ink-soft);margin-top:2px}
.blk.done .bt b{text-decoration:line-through;text-decoration-color:var(--p2);color:var(--ink-soft)}
.blk.done .coin{filter:saturate(.35) brightness(.92)}
.play{width:36px;height:36px;border-radius:50%;border:2px solid var(--p3);background:var(--paper-lt);color:var(--p3);cursor:pointer;font-size:14px;display:grid;place-items:center;padding:0}
.play:hover{background:var(--p3);color:var(--ontop)}
.play:disabled{opacity:.35;cursor:default}
input.seal{appearance:none;width:26px;height:26px;margin:0;border:2px solid var(--ink-soft);border-radius:50%;display:grid;place-content:center;cursor:pointer;background:rgba(255,255,255,.55);flex:0 0 26px}
input.seal:checked{background:radial-gradient(circle at 38% 32%,#D24A33,var(--p2) 55%,#6A160B);border-color:#6A160B;box-shadow:0 0 0 3px rgba(184,50,31,.22)}
input.seal:checked::after{content:"";width:6px;height:11px;border:solid #FFF8E6;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
input.seal:focus-visible{outline:2px solid var(--p3);outline-offset:3px}
.donemsg{margin-top:12px;padding:12px 14px;border:2px solid var(--p1);border-radius:3px;background:rgba(201,161,59,.15);font-size:16px}
.donemsg b{font-family:var(--display);font-weight:600;color:var(--p3);font-size:22px;display:block}
.rest{padding:14px;border:1.5px dashed var(--ink-soft);border-radius:3px;margin-bottom:10px}
.maplink{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border:2px solid var(--sc);border-left-width:6px;border-radius:3px;background:rgba(255,255,255,.45)}
.maplink>div{min-width:0;flex:1 1 220px}
.maplink small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sc);font-weight:700}
.maplink b{display:block;font-size:17px;line-height:1.25}
.maplink span{display:block;font-size:14.5px;font-style:italic;color:var(--ink-soft);margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{border:1.5px solid var(--ink-soft);border-radius:3px;padding:5px 2px;text-align:center;background:rgba(255,255,255,.45);min-width:0}
.wd b{display:block;font-size:13px}
.wd span{display:block;font-size:10.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wd.ok{background:var(--p2);border-color:#6A160B;color:#FFF8E6}
.wd.ok span{color:#FFF8E6}
.wd.miss{background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(92,74,54,.28) 3px 4px)}
.wd.off{opacity:.5;border-style:dotted}
.wd.now{box-shadow:0 0 0 2.5px var(--p1);background:var(--paper-lt)}
.wd.now.ok{background:var(--p2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1.5px solid var(--ink-soft);vertical-align:-1px;margin-right:4px}
.btnp{border:2px solid var(--p1);background:linear-gradient(180deg,#C84630,var(--p2));color:#FFF8E6;border-radius:3px;padding:9px 16px;font:700 15px var(--serif);letter-spacing:.04em;cursor:pointer;box-shadow:0 0 0 1.5px var(--ink),0 3px 0 var(--ink)}
.btng{border:2px solid var(--ink);background:var(--paper-lt);color:var(--ink);border-radius:3px;padding:8px 14px;font:600 15px var(--serif);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btnp:active,.btng:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btnp:focus-visible,.btng:focus-visible,.realm:focus-visible,.dayt:focus-visible,.x:focus-visible,.play:focus-visible,.timer .tb:focus-visible{outline:3px solid var(--p1l);outline-offset:2px}

/* mapa mental */
.board-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px;margin-bottom:12px;color:var(--ontop)}
.board-head h2{font-family:var(--display);font-weight:800;font-size:38px;margin:0;color:var(--p1l);line-height:1}
.board-head h2 small{font-family:var(--serif);font-weight:400;font-style:italic;font-size:17px;color:var(--ontop-soft);margin-left:10px}
.board-head p{margin:6px 0 0;color:var(--ontop-soft);max-width:62ch;font-size:16px}
.bprog{min-width:230px;font-size:14px;color:var(--ontop-soft);font-variant-numeric:tabular-nums}
.bprog .bar{height:10px;border:1.5px solid var(--p1);border-radius:2px;padding:1.5px;background:rgba(0,0,0,.6);margin-top:4px}
.bprog .bar i{display:block;height:100%;background:linear-gradient(180deg,var(--p1l),var(--p1d))}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--paper);border:2px solid var(--p1);border-radius:3px;padding:9px 14px;margin-bottom:12px;font-size:15.5px}
.hint{color:var(--ontop-soft);font-style:italic;font-size:15px;margin:10px 2px 0}
.board-frame{border-radius:4px;box-shadow:0 0 0 2px rgba(0,0,0,.7),0 22px 40px rgba(0,0,0,.6)}
.board-scroll{overflow-x:auto;border-radius:4px}
.board-inner{position:relative}
#board{display:block;width:100%;height:auto}
#board text{user-select:none}
.goth{font-family:var(--display)}
.sv{font-family:var(--serif)}
.space{cursor:pointer;outline:none}
.space:hover .face,.space:focus-visible .face{stroke:var(--p2);stroke-width:3}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.12);opacity:.6}}
.pop{position:absolute;z-index:5;width:310px;background:var(--paper-lt);border:3px solid var(--p1);outline:1.5px solid var(--sc);outline-offset:-7px;border-radius:3px;box-shadow:0 0 0 2px var(--ink),0 18px 40px rgba(0,0,0,.45);padding:18px 18px 16px}
.pop .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-soft);background:none;font-size:18px;line-height:1;cursor:pointer;color:var(--ink)}
.pop .eb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--sc);padding-right:30px}
.pop h3{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.05;margin:4px 0 8px}
.pop .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);margin-top:8px}
.pop ul{margin:4px 0 0;padding-left:20px;font-size:16px}
.pop ul li::marker{color:var(--sc)}
.pop p{margin:4px 0 0;font-size:16px;font-style:italic}
.pop .act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1.5px dashed rgba(92,74,54,.5)}
.pop .act span{font-size:14px;color:var(--ink-soft);font-style:italic}
.pop .status{display:inline-block;margin-top:2px;font-size:13.5px;font-weight:700;color:#FFF8E6;background:var(--sc);border-radius:9px;padding:1px 9px}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-14px);opacity:0;z-index:6;pointer-events:none;background:var(--p3);color:var(--p1l);border:2px solid var(--p1);box-shadow:0 0 0 1.5px var(--ink),0 10px 24px rgba(0,0,0,.4);border-radius:3px;padding:8px 18px;font-family:var(--display);font-size:22px;white-space:nowrap;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* etapas */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin-top:8px}
.sgrp h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:22px;color:var(--sc)}
.sgrp h4 svg{width:26px;height:26px;flex:0 0 26px}
.st{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border:1.5px solid rgba(42,30,20,.28);border-radius:3px;background:rgba(255,255,255,.35);cursor:pointer;margin-bottom:6px}
.st:hover{background:rgba(255,255,255,.65)}
.st strong{display:block;font-size:16.5px;line-height:1.2}
.st strong em{font-style:normal;color:var(--sc);font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.st span{display:block;color:var(--ink-soft);font-size:14.5px;margin-top:2px;font-style:italic}
.st.done strong{text-decoration:line-through;text-decoration-color:var(--p2)}

/* ritmo, caderno, recursos */
.field{margin-top:14px}
.field label{display:block;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--p2)}
.range output{font-family:var(--display);font-weight:600;font-size:26px;min-width:86px;text-align:right;font-variant-numeric:tabular-nums;color:var(--p3)}
.daysel{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dayt{border:2px solid var(--ink);border-radius:3px;background:var(--paper-lt);padding:7px 0;font:700 14px var(--serif);cursor:pointer;color:var(--ink)}
.dayt[aria-pressed="true"]{background:var(--p3);color:var(--p1l);border-color:var(--p1);box-shadow:0 0 0 1.5px var(--ink)}
select,textarea,.field input[type="text"]{width:100%;font:500 16px var(--serif);padding:8px 10px;border:2px solid var(--ink);border-radius:3px;background:var(--paper-lt);color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.45}
select:focus-visible,.range input:focus-visible,textarea:focus-visible,.field input[type="text"]:focus-visible{outline:3px solid var(--p3);outline-offset:2px}
.fc{margin-top:16px;border-top:1.5px dashed var(--ink-soft);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.fc div{display:flex;justify-content:space-between;gap:12px;font-size:15.5px}
.fc b{font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin:10px 0 0}
.reset{margin-top:12px;background:none;border:0;padding:0;color:var(--ink-soft);font:italic 14px var(--serif);text-decoration:underline;cursor:pointer}
.reset.armed{color:var(--p2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.saved{font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:6px;min-height:1.2em}
ul.rl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.rl li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid rgba(42,30,20,.28);border-radius:3px;background:rgba(255,255,255,.35)}
.rl .rk{flex:0 0 auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#FFF8E6;background:var(--rc);border-radius:3px;padding:3px 7px;margin-top:3px}
.rl a{color:var(--p3);font-weight:600;font-size:16.5px;text-decoration:underline;text-decoration-color:var(--p1)}
.rl span{display:block;color:var(--ink-soft);font-size:14.5px;margin-top:2px}
.tips{margin:10px 0 0;padding-left:20px;font-size:15.5px;display:flex;flex-direction:column;gap:6px}
.tips li::marker{color:var(--p2);font-weight:700}

/* XP, metas, missões extras, treino, conquistas, modal */
.xpbar{display:flex;align-items:center;gap:10px;margin:2px 0 12px;font-size:13.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.xpbar .lv{font-family:var(--display);font-weight:800;font-size:20px;color:var(--p3);white-space:nowrap}
.xpbar .bar{flex:1;height:10px;border:1.5px solid var(--ink);border-radius:2px;padding:1.5px;background:rgba(255,255,255,.45)}
.xpbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p1l),var(--p1d));transition:width .4s}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.goal{border:1.5px solid rgba(42,30,20,.3);border-radius:3px;padding:8px 10px;background:rgba(255,255,255,.4);min-width:0}
.goal small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal b{display:block;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1;color:var(--p3);font-variant-numeric:tabular-nums}
.goal .bar{height:6px;border-radius:3px;background:rgba(0,0,0,.12);margin-top:5px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--p2)}
.goal.ok b{color:#2F6B45}.goal.ok .bar i{background:#2F6B45}
.mis{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1.5px solid rgba(42,30,20,.3);border-radius:3px;background:rgba(255,255,255,.35)}
.mi .tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#FFF8E6;background:var(--mc);border-radius:3px;padding:2px 7px;margin-bottom:3px}
.mi label{cursor:pointer;min-width:0}
.mi b{display:block;font-size:16.5px;line-height:1.25}
.mi span{display:block;font-size:14.5px;color:var(--ink-soft);margin-top:2px}
.mi .mmin{font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-left:8px}
.tbsplit{margin:4px 0 10px;font-size:14px}
.mlinkbtn{text-decoration:none;display:inline-block;font-size:14px;padding:7px 10px;white-space:nowrap}
.mi .xp{font-family:var(--display);font-weight:600;font-size:18px;color:var(--p1d);white-space:nowrap}
.mi.done b{text-decoration:line-through;text-decoration-color:var(--p2);color:var(--ink-soft)}
.mi.done .xp{color:#2F6B45}
.train{margin-top:14px;padding:12px 14px;border:1.5px dashed var(--p3);border-radius:3px;background:rgba(255,255,255,.35)}
.train .q{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(42,30,20,.15)}
.train .q:first-of-type{border-top:0}
.train .q b{font-size:16.5px;line-height:1.3}
.train .q span{display:block;font-size:14.5px;color:var(--ink-soft);font-style:italic;margin-top:2px}
.train .q button{flex:0 0 auto;border:1.5px solid var(--p3);background:var(--paper-lt);color:var(--p3);border-radius:3px;padding:5px 10px;font:600 13px var(--serif);cursor:pointer}
.ach{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid rgba(42,30,20,.3);border-radius:3px;background:rgba(255,255,255,.35);opacity:.55}
.ach li.on{opacity:1;border-color:var(--p1d);background:rgba(201,161,59,.16)}
.ach .ic{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:#C9C2B0;color:#fff;font-size:16px;font-weight:700;font-family:var(--display)}
.ach li.on .ic{background:radial-gradient(circle at 35% 30%,#FFF2B8,#C9A13B 60%,#8C6A1E);color:var(--ink)}
.ach b{display:block;font-size:14.5px;line-height:1.2}
.ach span{display:block;font-size:12.5px;color:var(--ink-soft)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,8,20,.72);display:grid;place-items:center;padding:16px}
.overlay[hidden]{display:none}
.lvup{position:relative;width:min(440px,100%);background:var(--paper);border:3px solid var(--p1);outline:1.5px solid var(--p2);outline-offset:-8px;border-radius:4px;box-shadow:0 0 0 2px var(--ink),0 30px 60px rgba(0,0,0,.6);padding:30px 26px 26px;text-align:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.lvup .eyebrow{font-size:13px}
.lvup .big{width:110px;height:124px;margin:10px auto 6px;background:linear-gradient(180deg,var(--p1l),var(--p1d));clip-path:path("M0 0 H110 V64 C110 99 79 116 55 124 C31 116 0 99 0 64 Z");display:grid;place-items:center}
.lvup .big i{width:98px;height:112px;clip-path:path("M0 0 H98 V58 C98 89 70 104 49 112 C28 104 0 89 0 58 Z");background:var(--p3);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:46px;color:var(--p1l);padding-bottom:14px}
.lvup h3{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:6px 0 4px}
.lvup p{margin:0 0 16px;color:var(--ink-soft);font-size:16.5px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;background:var(--p1l);animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}

@media (max-width:980px){.layout{display:flex;flex-direction:column}.col{display:contents}.today{order:1}.boardwrap{order:2}.stepsc{order:3}.notes{order:4}.res{order:5}}
@media (max-width:640px){
  .board-inner{width:920px}
  .sgrid{grid-template-columns:minmax(0,1fr)}
  .stat{min-width:0;flex:1}
  .board-head h2{font-size:30px}
  .flagbox svg{width:64px;height:43px}
  .blk{grid-template-columns:28px 46px minmax(0,1fr) auto}
  .goals{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.goal{padding:6px 7px}.goal b{font-size:17px}
  .coin{width:46px;height:46px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fabbtn{position:fixed;right:14px;bottom:16px;z-index:40;width:42px;height:42px;border-radius:50%;border:2px solid color-mix(in srgb,var(--p1) 80%,transparent);background:color-mix(in srgb,var(--bg2) 78%,transparent);color:var(--ontop);display:grid;place-items:center;cursor:pointer;opacity:.62;backdrop-filter:blur(2px);box-shadow:0 2px 8px rgba(0,0,0,.25);transition:opacity .15s,transform .15s;padding:0}
.fabbtn:hover,.fabbtn:focus-visible{opacity:1;transform:scale(1.08)}.fabbtn[hidden]{display:none}
.fbdecks{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}.fbdecks li{border:1.5px solid #cdbd92;border-radius:8px;padding:9px 10px;background:rgba(255,255,255,.5)}
.fbt{display:flex;flex-direction:column;gap:1px;margin-bottom:7px}.fbt small{color:var(--ink-soft)}.fbact{display:flex;flex-wrap:wrap;gap:6px}.fbact .btng{padding:5px 11px;font-size:14px}.fbact .armed{background:#b3362b;color:#fff;border-color:#b3362b}
.fbh{font-family:var(--display);font-weight:600;font-size:22px;margin:14px 0 8px}#fabBody .field{margin-bottom:10px}
/* responsivo: trilhas em colunas (1 no celular, 2 no tablet, 3 no computador) */
#flow .frow.par{display:block;column-gap:16px;column-count:1}
#flow .frow.par .farea{break-inside:avoid;margin:0 0 16px;max-width:none;width:100%;display:inline-block}
#flow .fsteps{flex-direction:column;gap:0}#flow .farr{flex:0 0 26px;width:100%;height:26px;position:relative}#flow .fst{width:100%}
#flow .farea:not(.many) .fsteps{flex-direction:column}
@media (min-width:720px){#flow .frow.par{column-count:2}}
@media (min-width:1240px){#flow .frow.par{column-count:3}}
